name: Windows CUDA (RTX 40)

on:
  workflow_dispatch:
  push:
    branches: [build/windows-cuda]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CUDA_ARCH: '89'
      JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==4.4.3 ninja==1.13.2
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.8.1'
          method: network
      - name: Fetch pinned llama.cpp and apply Xolotl patch
        shell: bash
        run: bash tools/xolotl/fetch-llama.sh
      - name: Configure
        shell: cmd
        run: call build-win.bat configure
      - name: Build DeepSeek-V4.1 engine
        shell: cmd
        run: call build-win.bat ds41_generate
      - name: Package executable and runtime libraries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item build-win/ds41_generate.exe dist/
          Get-ChildItem build-win -Recurse -Filter *.dll | Copy-Item -Destination dist/
          foreach ($pattern in @('cudart64*.dll', 'cublas64*.dll', 'cublasLt64*.dll')) {
            $files = Get-ChildItem "$env:CUDA_PATH/bin" -Filter $pattern
            if (!$files) { throw "Missing CUDA runtime: $pattern" }
            $files | Copy-Item -Destination dist/
          }
          Copy-Item LICENSE dist/
          Copy-Item docs/WINDOWS.md dist/
          "Commit: $env:GITHUB_SHA`nTarget: sm_89 (RTX 40 series)`nCUDA: 12.8.1`nBuild only; GPU inference has not been tested on this runner." | Set-Content dist/BUILD.txt
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 4096 | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xolotl-windows-cuda-sm89
          path: dist/
          if-no-files-found: error
          retention-days: 14
